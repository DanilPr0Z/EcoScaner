services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    env_file: .env.production
    environment:
      # В контейнере пути свои, поэтому задаём их здесь, а не в .env:
      # так файл настроек остаётся одинаковым для сервера и для машины разработчика.
      DATABASE_URL: sqlite+aiosqlite:////data/bingo.db
      UPLOADS_DIR: /data/uploads
      # Три модели через запятую: ответы усредняются равными долями.
      # Они сильны в непересекающихся местах — боевая почти безошибочна
      # на органике и прочем, 8m на 288 пикселях берёт металл, пластик
      # и стекло. На независимом тесте из 1200 чужих снимков смесь даёт
      # 93.9% против 92.5% у боевой, а худшая категория поднимается
      # с 81.3 до 90.0. Цена — 41 мс на снимок вместо 10.
      WASTE_CLASSIFIER_WEIGHTS: /models/waste_classifier.pt,/models/waste_classifier.s.pt,/models/waste_classifier.m288.pt
      AUTO_CREATE_TABLES: "false"
    volumes:
      # База и снимки пользователей переживают пересборку образа.
      - bingo-data:/data
      # Веса монтируются с хоста: после переобучения достаточно положить новый
      # файл и перезапустить контейнер, пересобирать образ не нужно.
      - ./prediction/waste_classifier.pt:/models/waste_classifier.pt:ro
      - ./prediction/waste_classifier.s.pt:/models/waste_classifier.s.pt:ro
      - ./prediction/waste_classifier.m288.pt:/models/waste_classifier.m288.pt:ro
    expose:
      - "8000"

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  bingo-data:
