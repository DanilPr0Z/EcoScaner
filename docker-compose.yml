services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    env_file: .env.production
    environment:
      # В контейнере пути свои, поэтому задаём их здесь, а не в .env:
      # так файл настроек остаётся одинаковым для сервера и для машины разработчика.
      DATABASE_URL: sqlite+aiosqlite:////data/bingo.db
      UPLOADS_DIR: /data/uploads
      # Две модели через запятую: ответы усредняются. Они ошибаются
      # на разных снимках, поэтому вместе точнее любой из них — на
      # независимом тесте 93.5% против 92.5% и 92.3% поодиночке.
      WASTE_CLASSIFIER_WEIGHTS: /models/waste_classifier.pt,/models/waste_classifier.s.pt
      AUTO_CREATE_TABLES: "false"
    volumes:
      # База и снимки пользователей переживают пересборку образа.
      - bingo-data:/data
      # Веса монтируются с хоста: после переобучения достаточно положить новый
      # файл и перезапустить контейнер, пересобирать образ не нужно.
      - ./prediction/waste_classifier.pt:/models/waste_classifier.pt:ro
      - ./prediction/waste_classifier.s.pt:/models/waste_classifier.s.pt:ro
    expose:
      - "8000"

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  bingo-data:
