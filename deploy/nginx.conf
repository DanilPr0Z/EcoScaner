server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Загружаемые фото доходят до 10 МБ — столько же разрешает бэкенд.
    # Без этой строки nginx отрежет их раньше, отдав 413 со своей страницей.
    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Файлы сборки содержат хэш в имени, поэтому их можно кэшировать надолго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html не кэшируем: иначе после выкладки браузер продолжит грузить
    # старую страницу со ссылками на исчезнувшие файлы.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Распознавание на процессоре занимает секунды, дефолтных 60 хватает
        # с запасом, но при холодном старте модель ещё грузится.
        proxy_read_timeout 120s;
    }

    # Картинки справочника отдаёт бэкенд — они лежат рядом с его кодом.
    location /static/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Одностраничное приложение: любой путь отдаёт index.html, маршрут
    # разбирает уже роутер в браузере.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
